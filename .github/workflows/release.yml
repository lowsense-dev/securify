name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build without publishing, e.g. 1.8.0"
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$REQUESTED_VERSION"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$GITHUB_REF_TYPE" != tag ] && [ -z "$VERSION" ]; then
            VERSION="0.0.0-dev.$GITHUB_RUN_NUMBER"
            CODE=$GITHUB_RUN_NUMBER
          elif [[ "$VERSION" =~ ^(0|[1-9][0-9]{0,4})\.(0|[1-9][0-9]?)\.(0|[1-9][0-9]?)$ ]]; then
            CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
          else
            echo "::error::version must look like 1.2.3"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CODE=$CODE" >> "$GITHUB_ENV"

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks

      - name: Build
        env:
          SIGNING_STORE_FILE: release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          ./gradlew :shared:test :app:assembleRelease :desktop:appImage :desktop:windowsZip -PversionName="$VERSION" -PversionCode="$CODE"
          rm release.jks
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            abi=$(basename "$f" .apk | sed 's/^app-//; s/-release$//')
            cp "$f" "dist/securify-$VERSION-$abi.apk"
          done
          cp "desktop/build/appimage/securify-$VERSION-x86_64.AppImage" dist/
          cp "desktop/build/windows/securify-$VERSION-windows-x64.zip" dist/
          (cd dist && sha256sum *.apk *.AppImage *.zip > SHA256SUMS)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: securify-dist
          path: dist/

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: securify-dist
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          file=".github/release-notes/$GITHUB_REF_NAME.md"
          if [[ -f "$file" ]]; then notes=(--notes-file "$file"); fi
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Securify $GITHUB_REF_NAME" "${notes[@]}"
